<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Releases — dopamine</title>
<meta name="description" content="Every dopamine release, newest first, with its release notes and a download link.">
<link rel="icon" href="./assets/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="./assets/styles.css">
<script src="./assets/i18n.js" defer></script>
<script src="./assets/site.js" defer></script>
<script src="./assets/app.js" defer></script>
</head>
<body data-title="rel.title">

<nav class="topnav"><a href="./">← <span data-i18n="home">Home</span></a></nav>
<nav class="lang" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ja" aria-pressed="false">JA</button>
</nav>

<main class="sheet sheet--narrow">
  <h1 class="bi"><span lang="ja">リリース</span><span class="bi__sep">—</span><span lang="en">RELEASES</span></h1>
  <p class="page-lead" data-i18n="rel.lead">Every build, newest first. macOS 14+, Apple Silicon.</p>

  <!--
    JS が動かなくても、レート制限でも、ここが残って GitHub の一覧へ行ける。
    app.js は成功したときだけこれを隠して #releases-list を埋める。
  -->
  <p id="releases-fallback" class="status" hidden>
    <span data-i18n="rel.fail">Couldn’t load the release list from GitHub right now.</span>
    <a href="https://github.com/Route23/dopamine-releases/releases" data-i18n="rel.onGithub">See all releases on GitHub</a>.
  </p>
  <noscript>
    <p class="status">
      <a href="https://github.com/Route23/dopamine-releases/releases">See all releases on GitHub</a>.
    </p>
  </noscript>

  <ol id="releases-list" class="releases" reversed></ol>

  <footer class="colophon">
    <div class="colophon__row">
      <nav class="colophon__links">
        <a href="./" data-i18n="home">Home</a>
        <a href="https://github.com/Route23/dopamine-issues/issues" data-i18n="footer.bug">Report a bug</a>
        <a href="https://github.com/Route23/dopamine-releases" data-i18n="footer.github">GitHub</a>
      </nav>
    </div>
  </footer>
</main>

</body>
</html>
